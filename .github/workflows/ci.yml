name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt required for:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        if: runner.os == 'Linux'
        run: |
          cp go.mod go.mod.bak
          cp go.sum go.sum.bak
          go mod tidy
          if ! diff -q go.mod go.mod.bak >/dev/null || ! diff -q go.sum go.sum.bak >/dev/null; then
            echo "::error::go.mod/go.sum are not tidy; run 'go mod tidy'"
            diff -u go.mod.bak go.mod || true
            exit 1
          fi

      - run: go vet ./...
      - run: go build ./...

      - name: Test
        if: runner.os != 'Linux'
        run: go test ./...

      - name: Test with race detector and coverage
        if: runner.os == 'Linux'
        run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        if: runner.os == 'Linux'
        run: go tool cover -func=coverage.out | tail -1

  build-binary:
    name: build binary
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build (CGO-free)
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o fake-omise ./cmd/fake-omise
      - name: Smoke test the binary
        run: |
          ./fake-omise -addr 127.0.0.1:18080 -db /tmp/ci.db -3ds always &
          for i in $(seq 1 20); do
            if curl -sf -u skey_test_ci: http://127.0.0.1:18080/charges >/dev/null; then break; fi
            sleep 0.25
          done
          curl -sf -u skey_test_ci: http://127.0.0.1:18080/charges >/dev/null
          echo "fake-omise responded to GET /charges"
      - uses: actions/upload-artifact@v4
        with:
          name: fake-omise-linux-amd64
          path: fake-omise
          if-no-files-found: error
